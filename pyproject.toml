[project]
name = "universal-council"
version = "0.3.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.17.0",
  "coverage==7.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["company/runtime"]
omit = [
  "company/tests/*",
  "*/__pycache__/*",
  ".worktrees/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
