name: Command Center Stage 4

on:
  push:
    branches:
      - 'command-center/stage4-*'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Application/**'
      - 'apps/UniversalCouncil.CommandCenter.Infrastructure/**'
      - 'apps/UniversalCouncil.CommandCenter.Host/**'
      - 'apps/UniversalCouncil.CommandCenter.ExecutionService/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage2Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage3Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage4Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.UiSmoke/**'
      - 'state/command-center/**'
      - 'company/config/hybrid_execution.json'
      - 'company/config/tool_authority.json'
      - 'company/config/execution_contract.json'
      - 'company/config/task_aware_router.json'
      - 'tools/build_command_center_stage3_projection.py'
      - 'tools/build_command_center_stage4_projection.py'
      - 'tools/command_center_stage4_validate.py'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage4.yml'
  pull_request:
    branches:
      - 'command-center/stage3-*'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Application/**'
      - 'apps/UniversalCouncil.CommandCenter.Infrastructure/**'
      - 'apps/UniversalCouncil.CommandCenter.Host/**'
      - 'apps/UniversalCouncil.CommandCenter.ExecutionService/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage2Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage3Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage4Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.UiSmoke/**'
      - 'state/command-center/**'
      - 'company/config/hybrid_execution.json'
      - 'company/config/tool_authority.json'
      - 'company/config/execution_contract.json'
      - 'company/config/task_aware_router.json'
      - 'tools/build_command_center_stage3_projection.py'
      - 'tools/build_command_center_stage4_projection.py'
      - 'tools/command_center_stage4_validate.py'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage4.yml'

permissions:
  contents: read

concurrency:
  group: command-center-stage4-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Stage 4 Safe Execution Fabric Gate
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PHASE0_SHA: 63a4a446bc1e87f5352915f1e86c463de82e9b81
      PHASE0_STATUS_BLOB: 454f07f73a631627eae2eff2f8c229c8eb270ee1

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Exact-head violation: expected $env:CANDIDATE_SHA but checked out $actual"
          }
          Write-Host "Exact candidate head verified: $actual"

      - name: Verify pinned Phase 0 evidence
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin $env:PHASE0_SHA
          $actual = (git rev-parse "$($env:PHASE0_SHA):docs/operations/PHASE0_STATUS_2026-10-19.md").Trim()
          if ($actual -ne $env:PHASE0_STATUS_BLOB) {
            throw "Phase 0 evidence drift: expected $env:PHASE0_STATUS_BLOB but found $actual"
          }
          Write-Host "Pinned Phase 0 evidence verified: $actual"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Regenerate Stage 3 orchestration projection
        shell: pwsh
        run: |
          python tools/build_command_center_stage3_projection.py
          git diff --exit-code -- state/command-center/orchestration-catalog.json

      - name: Regenerate Stage 4 execution fabric
        shell: pwsh
        run: |
          python tools/build_command_center_stage4_projection.py
          git diff --exit-code -- state/command-center/execution-fabric.json

      - name: Stage 4 architecture and execution boundary
        shell: pwsh
        run: python tools/command_center_stage4_validate.py

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage2Validation/UniversalCouncil.CommandCenter.Stage2Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage3Validation/UniversalCouncil.CommandCenter.Stage3Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage4Validation/UniversalCouncil.CommandCenter.Stage4Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.UiSmoke/UniversalCouncil.CommandCenter.UiSmoke.csproj

      - name: Build WPF application
        shell: pwsh
        run: dotnet build apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore

      - name: Build Execution Service
        shell: pwsh
        run: dotnet build apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj --configuration Release --no-restore

      - name: Preserve Stage 2 fail-closed invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage2Validation/UniversalCouncil.CommandCenter.Stage2Validation.csproj --configuration Release

      - name: Preserve Stage 3 orchestration invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage3Validation/UniversalCouncil.CommandCenter.Stage3Validation.csproj --configuration Release

      - name: Run Stage 4 adversarial validation
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage4Validation/UniversalCouncil.CommandCenter.Stage4Validation.csproj --configuration Release

      - name: Execution Service safe status
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj --configuration Release -- status

      - name: Render exact-head UI evidence
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.UiSmoke/UniversalCouncil.CommandCenter.UiSmoke.csproj --configuration Release -- artifacts/command-center-stage4-ui

      - name: Upload UI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-CommandCenter-Stage4-UI-${{ env.CANDIDATE_SHA }}
          path: artifacts/command-center-stage4-ui/
          if-no-files-found: error
          retention-days: 7

      - name: Publish Command Center
        shell: pwsh
        run: dotnet publish apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore --output artifacts/command-center-stage4

      - name: Publish Execution Service
        shell: pwsh
        run: dotnet publish apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj --configuration Release --no-restore --output artifacts/execution-service-stage4

      - name: Assert published Stage 4 state sources
        shell: pwsh
        run: |
          foreach ($path in @(
            'artifacts/command-center-stage4/state/command-center-state.json',
            'artifacts/command-center-stage4/state/orchestration-catalog.json',
            'artifacts/command-center-stage4/state/execution-fabric.json',
            'artifacts/execution-service-stage4/state/execution-fabric.json'
          )) {
            if (!(Test-Path (Join-Path $pwd $path))) {
              throw "Published Stage 4 source missing: $path"
            }
          }

      - name: Upload Command Center artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-CommandCenter-Stage4-${{ env.CANDIDATE_SHA }}
          path: artifacts/command-center-stage4/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Execution Service artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-ExecutionService-Stage4-${{ env.CANDIDATE_SHA }}
          path: artifacts/execution-service-stage4/
          if-no-files-found: error
          retention-days: 7
