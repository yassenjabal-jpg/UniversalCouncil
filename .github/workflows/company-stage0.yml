name: Company Stage 0

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install pinned quality tools
        run: python -c "import subprocess,sys,tomllib; d=tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['dev']; subprocess.check_call([sys.executable,'-m','pip','install',*d])"
      - name: Determine changed Python
        id: change_scope
        shell: bash
        run: |
          mkdir -p build
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$GITHUB_BASE_REF"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD^"
            fi
          fi
          python tools/change_scope.py --base "$BASE" --python > build/changed-python.txt
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Ruff lint changed Python
        shell: bash
        run: |
          mapfile -t FILES < build/changed-python.txt
          if [ "${#FILES[@]}" -gt 0 ]; then
            python -m ruff check "${FILES[@]}"
          fi
      - name: Ruff format changed Python
        shell: bash
        run: |
          mapfile -t FILES < build/changed-python.txt
          if [ "${#FILES[@]}" -gt 0 ]; then
            python -m ruff format --check "${FILES[@]}"
          fi
      - name: Compile
        run: python -m compileall -q company tools
      - name: Preserve Universal Council invariants
        run: python tools/validate_config.py
      - name: Stage 0 behavior tests with branch coverage
        shell: bash
        run: |
          mkdir -p build
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s company/tests -v
          python -m coverage json -o build/coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("build/coverage.json").read_text(encoding="utf-8"))
          files = {}
          for path, entry in sorted(raw["files"].items()):
              path = path.replace("\\", "/")
              if not path.startswith("company/runtime/") or not path.endswith(".py"):
                  continue
              summary = entry["summary"]
              branches = summary.get("num_branches", 0)
              branch = None if not branches else summary.get("covered_branches", 0) / branches * 100.0
              files[path] = {
                  "line": float(summary["percent_covered"]),
                  "branch": branch,
                  "statements": int(summary["num_statements"]),
              }
          baseline = {
              "version": "1.0",
              "source_commit": "bfc08b5ea98f352f595029f62fcefe6cc93395fb",
              "generated_date": "2026-10-11",
              "files": files,
          }
          print("COVERAGE_BASELINE_JSON=" + json.dumps(baseline, sort_keys=True, separators=(",", ":")))
          PY

  python312:
    name: Python 3.12 Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q company tools
      - name: Preserve Universal Council invariants
        run: python tools/validate_config.py
      - name: Stage 0 behavior tests
        run: python -m unittest discover -s company/tests -v
