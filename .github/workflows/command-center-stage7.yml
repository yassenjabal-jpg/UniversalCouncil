name: Command Center Stage 7

on:
  push:
    branches:
      - 'command-center/stage7-*'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Application/**'
      - 'apps/UniversalCouncil.CommandCenter.Infrastructure/**'
      - 'apps/UniversalCouncil.CommandCenter.Host/**'
      - 'apps/UniversalCouncil.CommandCenter.ExecutionService/**'
      - 'apps/UniversalCouncil.CommandCenter.RemoteGateway/**'
      - 'apps/UniversalCouncil.CommandCenter.RemoteTransport/**'
      - 'apps/UniversalCouncil.CommandCenter.OwnerEnrollment/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage2Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage3Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage4Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage5Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage6Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage7Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.UiSmoke/**'
      - 'state/command-center/**'
      - 'tools/build_command_center_stage3_projection.py'
      - 'tools/build_command_center_stage4_projection.py'
      - 'tools/build_command_center_stage5_projection.py'
      - 'tools/build_command_center_stage6_projection.py'
      - 'tools/build_command_center_stage7_projection.py'
      - 'tools/command_center_stage7_validate.py'
      - 'tools/stage7_*.ps1'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage7.yml'
  pull_request:
    branches:
      - 'command-center/stage6-*'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Application/**'
      - 'apps/UniversalCouncil.CommandCenter.Infrastructure/**'
      - 'apps/UniversalCouncil.CommandCenter.Host/**'
      - 'apps/UniversalCouncil.CommandCenter.ExecutionService/**'
      - 'apps/UniversalCouncil.CommandCenter.RemoteGateway/**'
      - 'apps/UniversalCouncil.CommandCenter.RemoteTransport/**'
      - 'apps/UniversalCouncil.CommandCenter.OwnerEnrollment/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage2Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage3Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage4Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage5Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage6Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage7Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.UiSmoke/**'
      - 'state/command-center/**'
      - 'tools/build_command_center_stage3_projection.py'
      - 'tools/build_command_center_stage4_projection.py'
      - 'tools/build_command_center_stage5_projection.py'
      - 'tools/build_command_center_stage6_projection.py'
      - 'tools/build_command_center_stage7_projection.py'
      - 'tools/command_center_stage7_validate.py'
      - 'tools/stage7_*.ps1'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage7.yml'

permissions:
  contents: read

concurrency:
  group: command-center-stage7-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Stage 7 Owner Device + Tailnet Foundation Gate
    runs-on: windows-2025-vs2026
    timeout-minutes: 35

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Exact-head violation: expected $env:CANDIDATE_SHA but checked out $actual"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Regenerate Stage 3 projection
        shell: pwsh
        run: |
          python tools/build_command_center_stage3_projection.py
          git diff --exit-code -- state/command-center/orchestration-catalog.json

      - name: Regenerate Stage 4 projection
        shell: pwsh
        run: |
          python tools/build_command_center_stage4_projection.py
          git diff --exit-code -- state/command-center/execution-fabric.json

      - name: Regenerate Stage 5 projection
        shell: pwsh
        run: |
          python tools/build_command_center_stage5_projection.py
          git diff --exit-code -- state/command-center/remote-owner-gateway.json

      - name: Regenerate Stage 6 projection
        shell: pwsh
        run: |
          python tools/build_command_center_stage6_projection.py
          git diff --exit-code -- state/command-center/remote-transport.json

      - name: Regenerate Stage 7 projection
        shell: pwsh
        run: |
          python tools/build_command_center_stage7_projection.py
          git diff --exit-code -- state/command-center/owner-device-tailnet.json

      - name: Stage 7 architecture and tailnet boundary
        shell: pwsh
        run: python tools/command_center_stage7_validate.py

      - name: Parse Stage 7 PowerShell host kit
        shell: pwsh
        run: |
          foreach ($script in @(
            'tools/stage7_yassin_probe.ps1',
            'tools/stage7_configure_tailscale_serve.ps1',
            'tools/stage7_start_remote_transport.ps1'
          )) {
            [scriptblock]::Create((Get-Content -Raw $script)) | Out-Null
            Write-Host "Parsed $script"
          }

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.RemoteGateway/UniversalCouncil.CommandCenter.RemoteGateway.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.RemoteTransport/UniversalCouncil.CommandCenter.RemoteTransport.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.OwnerEnrollment/UniversalCouncil.CommandCenter.OwnerEnrollment.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage2Validation/UniversalCouncil.CommandCenter.Stage2Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage3Validation/UniversalCouncil.CommandCenter.Stage3Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage4Validation/UniversalCouncil.CommandCenter.Stage4Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage5Validation/UniversalCouncil.CommandCenter.Stage5Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage6Validation/UniversalCouncil.CommandCenter.Stage6Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage7Validation/UniversalCouncil.CommandCenter.Stage7Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.UiSmoke/UniversalCouncil.CommandCenter.UiSmoke.csproj

      - name: Build product executables
        shell: pwsh
        run: |
          dotnet build apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore
          dotnet build apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj --configuration Release --no-restore
          dotnet build apps/UniversalCouncil.CommandCenter.RemoteGateway/UniversalCouncil.CommandCenter.RemoteGateway.csproj --configuration Release --no-restore
          dotnet build apps/UniversalCouncil.CommandCenter.RemoteTransport/UniversalCouncil.CommandCenter.RemoteTransport.csproj --configuration Release --no-restore
          dotnet build apps/UniversalCouncil.CommandCenter.OwnerEnrollment/UniversalCouncil.CommandCenter.OwnerEnrollment.csproj --configuration Release --no-restore

      - name: Preserve Stage 2 invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage2Validation/UniversalCouncil.CommandCenter.Stage2Validation.csproj --configuration Release

      - name: Preserve Stage 3 invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage3Validation/UniversalCouncil.CommandCenter.Stage3Validation.csproj --configuration Release

      - name: Preserve Stage 4 invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage4Validation/UniversalCouncil.CommandCenter.Stage4Validation.csproj --configuration Release

      - name: Preserve Stage 5 invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage5Validation/UniversalCouncil.CommandCenter.Stage5Validation.csproj --configuration Release

      - name: Preserve Stage 6 authenticated loopback invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage6Validation/UniversalCouncil.CommandCenter.Stage6Validation.csproj --configuration Release

      - name: Run Stage 7 owner enrollment and revocation validation
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage7Validation/UniversalCouncil.CommandCenter.Stage7Validation.csproj --configuration Release

      - name: Render exact-head UI evidence
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.UiSmoke/UniversalCouncil.CommandCenter.UiSmoke.csproj --configuration Release -- artifacts/command-center-stage7-ui

      - name: Upload UI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-CommandCenter-Stage7-UI-${{ env.CANDIDATE_SHA }}
          path: artifacts/command-center-stage7-ui/
          if-no-files-found: error
          retention-days: 7

      - name: Publish Stage 7 binaries
        shell: pwsh
        run: |
          dotnet publish apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore --output artifacts/command-center-stage7
          dotnet publish apps/UniversalCouncil.CommandCenter.RemoteTransport/UniversalCouncil.CommandCenter.RemoteTransport.csproj --configuration Release --no-restore --output artifacts/remote-transport-stage7
          dotnet publish apps/UniversalCouncil.CommandCenter.OwnerEnrollment/UniversalCouncil.CommandCenter.OwnerEnrollment.csproj --configuration Release --no-restore --output artifacts/owner-enrollment-stage7

      - name: Assemble YASSIN Stage 7 host kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/stage7-yassin-host-kit/RemoteTransport | Out-Null
          New-Item -ItemType Directory -Force artifacts/stage7-yassin-host-kit/OwnerEnrollment | Out-Null
          New-Item -ItemType Directory -Force artifacts/stage7-yassin-host-kit/tools | Out-Null
          Copy-Item artifacts/remote-transport-stage7/* artifacts/stage7-yassin-host-kit/RemoteTransport -Recurse -Force
          Copy-Item artifacts/owner-enrollment-stage7/* artifacts/stage7-yassin-host-kit/OwnerEnrollment -Recurse -Force
          Copy-Item tools/stage7_yassin_probe.ps1 artifacts/stage7-yassin-host-kit/tools/
          Copy-Item tools/stage7_configure_tailscale_serve.ps1 artifacts/stage7-yassin-host-kit/tools/
          Copy-Item tools/stage7_start_remote_transport.ps1 artifacts/stage7-yassin-host-kit/tools/
          Copy-Item docs/operations/command-center/STAGE7_OWNER_DEVICE_TAILNET_CONTRACT_2026-10-19.md artifacts/stage7-yassin-host-kit/

      - name: Assert published Stage 7 sources
        shell: pwsh
        run: |
          foreach ($path in @(
            'artifacts/command-center-stage7/state/owner-device-tailnet.json',
            'artifacts/remote-transport-stage7/state/remote-owner-gateway.json',
            'artifacts/remote-transport-stage7/state/remote-transport.json',
            'artifacts/stage7-yassin-host-kit/tools/stage7_yassin_probe.ps1',
            'artifacts/stage7-yassin-host-kit/tools/stage7_configure_tailscale_serve.ps1',
            'artifacts/stage7-yassin-host-kit/tools/stage7_start_remote_transport.ps1'
          )) {
            if (!(Test-Path (Join-Path $pwd $path))) {
              throw "Published Stage 7 source missing: $path"
            }
          }

      - name: Upload Command Center
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-CommandCenter-Stage7-${{ env.CANDIDATE_SHA }}
          path: artifacts/command-center-stage7/
          if-no-files-found: error
          retention-days: 7

      - name: Upload YASSIN Host Kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-Stage7-YASSIN-HostKit-${{ env.CANDIDATE_SHA }}
          path: artifacts/stage7-yassin-host-kit/
          if-no-files-found: error
          retention-days: 7
