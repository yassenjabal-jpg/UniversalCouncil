name: Command Center Stage 1

on:
  push:
    branches:
      - 'command-center/**'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Validation/**'
      - 'tools/command_center_stage1_validate.py'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage1.yml'
  pull_request:
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Validation/**'
      - 'tools/command_center_stage1_validate.py'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage1.yml'

permissions:
  contents: read

concurrency:
  group: command-center-stage1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Stage 1 Windows Build + Boundary Validation
    runs-on: windows-2025-vs2026
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Static architecture boundary
        shell: pwsh
        run: python tools/command_center_stage1_validate.py

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Validation/UniversalCouncil.CommandCenter.Validation.csproj

      - name: Build WPF shell
        shell: pwsh
        run: dotnet build apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore

      - name: Run Stage 1 validation executable
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Validation/UniversalCouncil.CommandCenter.Validation.csproj --configuration Release

      - name: Publish shell artifact
        shell: pwsh
        run: dotnet publish apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore --output artifacts/command-center-stage1

      - name: Upload shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCouncil-CommandCenter-Stage1-${{ github.sha }}
          path: artifacts/command-center-stage1/
          if-no-files-found: error
          retention-days: 7
