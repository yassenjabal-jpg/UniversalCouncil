name: Memory Rebuild

on:
  push:
    branches:
      - "main"
    paths:
      - "memory/events/**"

permissions:
  contents: write

concurrency:
  group: universal-memory-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Validate and rebuild canonical memory
        run: |
          python tools/memory_rebuild.py
          python tools/validate_config.py
      - name: Commit generated memory snapshots
        shell: bash
        run: |
          if git diff --quiet -- memory/snapshots memory/catalog.json; then
            echo "Memory snapshots already current."
            exit 0
          fi
          git config user.name "Universal Memory Fabric"
          git config user.email "memory-fabric@users.noreply.github.com"
          git add memory/snapshots memory/catalog.json
          git commit -m "memory: rebuild canonical snapshots"
          git push origin HEAD:main
