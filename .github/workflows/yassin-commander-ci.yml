name: YASSIN Commander CI

on:
  push:
    branches:
      - design/yassin-commander
    paths:
      - 'tools/yassin_commander/**'
      - '.github/workflows/yassin-commander-ci.yml'
  pull_request:
    paths:
      - 'tools/yassin_commander/**'
      - '.github/workflows/yassin-commander-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/yassin_commander
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Resolve module lock
        run: |
          go mod tidy
          echo '--- GO_SUM_BEGIN ---'
          cat go.sum
          echo '--- GO_SUM_END ---'
      - name: Test
        run: go test ./...
