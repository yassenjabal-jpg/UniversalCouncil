name: Command Center Stage 5

on:
  push:
    branches:
      - 'command-center/stage5-*'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Application/**'
      - 'apps/UniversalCouncil.CommandCenter.Infrastructure/**'
      - 'apps/UniversalCouncil.CommandCenter.Host/**'
      - 'apps/UniversalCouncil.CommandCenter.ExecutionService/**'
      - 'apps/UniversalCouncil.CommandCenter.RemoteGateway/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage2Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage3Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage4Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage5Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.UiSmoke/**'
      - 'state/command-center/**'
      - 'tools/build_command_center_stage3_projection.py'
      - 'tools/build_command_center_stage4_projection.py'
      - 'tools/build_command_center_stage5_projection.py'
      - 'tools/command_center_stage5_validate.py'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage5.yml'
  pull_request:
    branches:
      - 'command-center/stage4-*'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Application/**'
      - 'apps/UniversalCouncil.CommandCenter.Infrastructure/**'
      - 'apps/UniversalCouncil.CommandCenter.Host/**'
      - 'apps/UniversalCouncil.CommandCenter.ExecutionService/**'
      - 'apps/UniversalCouncil.CommandCenter.RemoteGateway/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage2Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage3Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage4Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage5Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.UiSmoke/**'
      - 'state/command-center/**'
      - 'tools/build_command_center_stage3_projection.py'
      - 'tools/build_command_center_stage4_projection.py'
      - 'tools/build_command_center_stage5_projection.py'
      - 'tools/command_center_stage5_validate.py'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage5.yml'

permissions:
  contents: read

concurrency:
  group: command-center-stage5-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Stage 5 Remote Owner Trust Gate
    runs-on: windows-2025-vs2026
    timeout-minutes: 25

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PHASE0_SHA: 63a4a446bc1e87f5352915f1e86c463de82e9b81
      PHASE0_GUARD_BLOB: 56d76a96c0ab5d74e703f69a53b2cd51d0d2843c
      PHASE0_CONFIG_BLOB: 57b26c4d8fc65c9e866ddefd826784f7826c7f24
      PHASE0_TEST_BLOB: f0ac55efd4e3462e0a1a56b376140db07fd20739

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Exact-head violation: expected $env:CANDIDATE_SHA but checked out $actual"
          }
          Write-Host "Exact candidate head verified: $actual"

      - name: Verify pinned Phase 0 remote-command sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin $env:PHASE0_SHA

          $guard = (git rev-parse "$($env:PHASE0_SHA):company/runtime/phase0_guardrails.py").Trim()
          $config = (git rev-parse "$($env:PHASE0_SHA):company/config/phase0_feasibility.json").Trim()
          $test = (git rev-parse "$($env:PHASE0_SHA):company/tests/test_phase0_feasibility.py").Trim()

          if ($guard -ne $env:PHASE0_GUARD_BLOB) {
            throw "Phase 0 guardrail blob drift: $guard"
          }
          if ($config -ne $env:PHASE0_CONFIG_BLOB) {
            throw "Phase 0 config blob drift: $config"
          }
          if ($test -ne $env:PHASE0_TEST_BLOB) {
            throw "Phase 0 test blob drift: $test"
          }

          Write-Host "Pinned Phase 0 remote-command sources verified."

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Regenerate Stage 3 orchestration projection
        shell: pwsh
        run: |
          python tools/build_command_center_stage3_projection.py
          git diff --exit-code -- state/command-center/orchestration-catalog.json

      - name: Regenerate Stage 4 execution fabric
        shell: pwsh
        run: |
          python tools/build_command_center_stage4_projection.py
          git diff --exit-code -- state/command-center/execution-fabric.json

      - name: Regenerate Stage 5 remote owner gateway
        shell: pwsh
        run: |
          python tools/build_command_center_stage5_projection.py
          git diff --exit-code -- state/command-center/remote-owner-gateway.json

      - name: Stage 5 architecture and remote trust boundary
        shell: pwsh
        run: python tools/command_center_stage5_validate.py

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.RemoteGateway/UniversalCouncil.CommandCenter.RemoteGateway.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage2Validation/UniversalCouncil.CommandCenter.Stage2Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage3Validation/UniversalCouncil.CommandCenter.Stage3Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage4Validation/UniversalCouncil.CommandCenter.Stage4Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage5Validation/UniversalCouncil.CommandCenter.Stage5Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.UiSmoke/UniversalCouncil.CommandCenter.UiSmoke.csproj

      - name: Build WPF application
        shell: pwsh
        run: dotnet build apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore

      - name: Build Execution Service
        shell: pwsh
        run: dotnet build apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj --configuration Release --no-restore

      - name: Build Remote Gateway
        shell: pwsh
        run: dotnet build apps/UniversalCouncil.CommandCenter.RemoteGateway/UniversalCouncil.CommandCenter.RemoteGateway.csproj --configuration Release --no-restore

      - name: Preserve Stage 2 fail-closed invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage2Validation/UniversalCouncil.CommandCenter.Stage2Validation.csproj --configuration Release

      - name: Preserve Stage 3 orchestration invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage3Validation/UniversalCouncil.CommandCenter.Stage3Validation.csproj --configuration Release

      - name: Preserve Stage 4 execution-fabric invariants
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage4Validation/UniversalCouncil.CommandCenter.Stage4Validation.csproj --configuration Release

      - name: Run Stage 5 adversarial validation
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage5Validation/UniversalCouncil.CommandCenter.Stage5Validation.csproj --configuration Release

      - name: Remote Gateway safe status
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.RemoteGateway/UniversalCouncil.CommandCenter.RemoteGateway.csproj --configuration Release -- status

      - name: Render exact-head UI evidence
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.UiSmoke/UniversalCouncil.CommandCenter.UiSmoke.csproj --configuration Release -- artifacts/command-center-stage5-ui

      - name: Upload UI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-CommandCenter-Stage5-UI-${{ env.CANDIDATE_SHA }}
          path: artifacts/command-center-stage5-ui/
          if-no-files-found: error
          retention-days: 7

      - name: Publish Command Center
        shell: pwsh
        run: dotnet publish apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore --output artifacts/command-center-stage5

      - name: Publish Execution Service
        shell: pwsh
        run: dotnet publish apps/UniversalCouncil.CommandCenter.ExecutionService/UniversalCouncil.CommandCenter.ExecutionService.csproj --configuration Release --no-restore --output artifacts/execution-service-stage5

      - name: Publish Remote Gateway
        shell: pwsh
        run: dotnet publish apps/UniversalCouncil.CommandCenter.RemoteGateway/UniversalCouncil.CommandCenter.RemoteGateway.csproj --configuration Release --no-restore --output artifacts/remote-gateway-stage5

      - name: Assert published Stage 5 state sources
        shell: pwsh
        run: |
          foreach ($path in @(
            'artifacts/command-center-stage5/state/command-center-state.json',
            'artifacts/command-center-stage5/state/orchestration-catalog.json',
            'artifacts/command-center-stage5/state/execution-fabric.json',
            'artifacts/command-center-stage5/state/remote-owner-gateway.json',
            'artifacts/execution-service-stage5/state/execution-fabric.json',
            'artifacts/remote-gateway-stage5/state/remote-owner-gateway.json'
          )) {
            if (!(Test-Path (Join-Path $pwd $path))) {
              throw "Published Stage 5 source missing: $path"
            }
          }

      - name: Upload Command Center artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-CommandCenter-Stage5-${{ env.CANDIDATE_SHA }}
          path: artifacts/command-center-stage5/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Execution Service artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-ExecutionService-Stage5-${{ env.CANDIDATE_SHA }}
          path: artifacts/execution-service-stage5/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Remote Gateway artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-RemoteGateway-Stage5-${{ env.CANDIDATE_SHA }}
          path: artifacts/remote-gateway-stage5/
          if-no-files-found: error
          retention-days: 7
