name: Command Center supervision foundation
on:
  push:
    branches: [command-center/murtakaz-supervisor-foundation-20261022]
  pull_request:
    paths:
      - 'apps/UniversalCouncil.CommandCenter*/**'
      - 'tools/build_command_center_murtakaz_projection.py'
      - 'company/tests/test_murtakaz_projection_provenance.py'
      - 'state/command-center/project-governance/**'
      - '.github/workflows/command-center-supervision.yml'
permissions:
  contents: read
jobs:
  supervision:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: python -m unittest company.tests.test_murtakaz_projection_provenance company.tests.test_command_center_project_governance -v
      - run: python tools/command_center_murtakaz_validate.py
      - run: dotnet run --project apps/UniversalCouncil.CommandCenter.SupervisionValidation -c Release
      - run: dotnet build apps/UniversalCouncil.CommandCenter -c Release --nologo
