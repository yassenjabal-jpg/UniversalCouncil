name: Command Center Stage 2

on:
  push:
    branches:
      - 'command-center/stage2-*'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Application/**'
      - 'apps/UniversalCouncil.CommandCenter.Infrastructure/**'
      - 'apps/UniversalCouncil.CommandCenter.Host/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage2Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.UiSmoke/**'
      - 'state/command-center/**'
      - 'tools/command_center_stage2_validate.py'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage2.yml'
  pull_request:
    branches:
      - 'command-center/stage1-*'
    paths:
      - 'apps/UniversalCouncil.CommandCenter/**'
      - 'apps/UniversalCouncil.CommandCenter.Core/**'
      - 'apps/UniversalCouncil.CommandCenter.Application/**'
      - 'apps/UniversalCouncil.CommandCenter.Infrastructure/**'
      - 'apps/UniversalCouncil.CommandCenter.Host/**'
      - 'apps/UniversalCouncil.CommandCenter.Stage2Validation/**'
      - 'apps/UniversalCouncil.CommandCenter.UiSmoke/**'
      - 'state/command-center/**'
      - 'tools/command_center_stage2_validate.py'
      - 'docs/operations/command-center/**'
      - '.github/workflows/command-center-stage2.yml'

permissions:
  contents: read

concurrency:
  group: command-center-stage2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Stage 2 State + Evidence Gate
    runs-on: windows-2025-vs2026
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Exact-head violation: expected $env:CANDIDATE_SHA but checked out $actual"
          }
          Write-Host "Exact candidate head verified: $actual"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Stage 2 architecture boundary
        shell: pwsh
        run: python tools/command_center_stage2_validate.py

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.Stage2Validation/UniversalCouncil.CommandCenter.Stage2Validation.csproj
          dotnet restore apps/UniversalCouncil.CommandCenter.UiSmoke/UniversalCouncil.CommandCenter.UiSmoke.csproj

      - name: Build WPF application
        shell: pwsh
        run: dotnet build apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore

      - name: Run Stage 2 adversarial validation
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.Stage2Validation/UniversalCouncil.CommandCenter.Stage2Validation.csproj --configuration Release

      - name: Render exact-head UI evidence
        shell: pwsh
        run: dotnet run --project apps/UniversalCouncil.CommandCenter.UiSmoke/UniversalCouncil.CommandCenter.UiSmoke.csproj --configuration Release -- artifacts/command-center-stage2-ui

      - name: Upload UI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-CommandCenter-Stage2-UI-${{ env.CANDIDATE_SHA }}
          path: artifacts/command-center-stage2-ui/
          if-no-files-found: error
          retention-days: 7

      - name: Publish application
        shell: pwsh
        run: dotnet publish apps/UniversalCouncil.CommandCenter/UniversalCouncil.CommandCenter.csproj --configuration Release --no-restore --output artifacts/command-center-stage2

      - name: Assert published state source exists
        shell: pwsh
        run: |
          $state = Join-Path $pwd 'artifacts/command-center-stage2/state/command-center-state.json'
          if (!(Test-Path $state)) {
            throw "Published operational state source missing: $state"
          }

      - name: Upload application artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniversalCouncil-CommandCenter-Stage2-${{ env.CANDIDATE_SHA }}
          path: artifacts/command-center-stage2/
          if-no-files-found: error
          retention-days: 7
